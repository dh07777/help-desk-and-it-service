{% extends "base.html" %}

{% block title %}Set New Password - SupportDesk{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 44px; height: 44px; font-size: 1.25rem;">🔒</div>
      <h2 class="auth-title">Set New Password</h2>
      <p class="auth-subtitle">Please enter and confirm your new secure password</p>
    </div>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="password">New Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
